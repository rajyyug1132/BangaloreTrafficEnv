name: BangaloreTrafficEnv
version: "1.0"
description: >
  A real-world RL environment simulating a Bangalore traffic intersection.
  An AI agent learns to dynamically control traffic signals to minimize
  congestion across North, South, East and West lanes.

author: RyM1132

observation_space:
  type: array
  shape: [6]
  description: >
    [cars_north, cars_south, cars_east, cars_west, green_phase, time_step]

action_space:
  type: discrete
  n: 2
  description: >
    0 = North-South green, 1 = East-West green

reward:
  description: Negative sum of all waiting cars. Higher = less congestion.
  range: [-inf, 0]

score:
  description: Normalised reward in 0.0-1.0 range for grader.
  range: [0.0, 1.0]

environment:
  name: BangaloreTrafficEnv
  url: https://rym1132-bangaloretrafficenv.hf.space

tasks:
  - id: rush_hour_control
    name: Rush Hour Traffic
    description: Minimize congestion during peak traffic bursts (Poisson lambda=8) over 100 steps.
    difficulty: hard
    grader: graders:grade_rush_hour

  - id: off_peak_control
    name: Off Peak Traffic
    description: Minimize congestion during standard traffic flow (Poisson lambda=3) over 100 steps.
    difficulty: easy
    grader: graders:grade_off_peak

  - id: sustained_flow
    name: Sustained Flow
    description: Maintain average queue size below 5 cars per lane over 100 steps.
    difficulty: medium
    grader: graders:grade_sustained_flow

endpoints:
  reset: POST /reset
  step:  POST /step
  state: GET  /state

runtime:
  language: python
  entry: server/app.py
  port: 7860