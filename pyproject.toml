[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bangaloretrafficenv"
version = "1.0.0"
description = "Bangalore Traffic RL Environment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "matplotlib",
    "openai",
    "pydantic"
]